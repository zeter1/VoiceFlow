name: Python checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceflow-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python source and tests
        shell: pwsh
        run: python -m compileall -q voiceflow.py voiceflow_app tests

      - name: Run offline repository contract tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Install packaging dependencies
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"
          python -m pip check

      - name: Build packaged Windows application
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm','--clean','--onedir','--windowed','--name','VoiceFlow',
            '--collect-all','faster_whisper',
            '--collect-all','ctranslate2',
            '--collect-all','av',
            '--collect-all','huggingface_hub',
            '--collect-all','language_tool_python',
            '--hidden-import','pystray._win32',
            'voiceflow.py'
          )
          python -m PyInstaller @args

      - name: Smoke-test packaged EXE
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $exe = 'dist\VoiceFlow\VoiceFlow.exe'
          if (-not (Test-Path $exe)) { throw 'VoiceFlow.exe was not created' }

          $selfTestOutput = Join-Path $env:RUNNER_TEMP 'voiceflow-self-test.json'
          if (Test-Path $selfTestOutput) { Remove-Item $selfTestOutput -Force }
          $env:VOICEFLOW_SELF_TEST_OUTPUT = $selfTestOutput

          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged self-test timed out after 90 seconds'
          }

          if (Test-Path $selfTestOutput) {
            Write-Host 'Packaged self-test payload:'
            Get-Content $selfTestOutput
          } else {
            Write-Warning 'Packaged self-test did not create its diagnostic payload'
          }

          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Create portable ZIP and checksum
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $zip = 'dist\VoiceFlow-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'dist\VoiceFlow\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VoiceFlow-Windows-x64.zip" | Set-Content 'dist\VoiceFlow-Windows-x64.sha256.txt' -Encoding ascii
          Get-Item $zip | Format-List Name,Length,LastWriteTime
          Get-Content 'dist\VoiceFlow-Windows-x64.sha256.txt'

      - name: Upload packaged Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VoiceFlow-Windows-x64
          path: |
            dist/VoiceFlow-Windows-x64.zip
            dist/VoiceFlow-Windows-x64.sha256.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: syntax-and-contracts
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require fresh Russian release notes on package pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq RELEASE_NOTES_RU.md || {
            echo "RELEASE_NOTES_RU.md must be updated in the same [package] commit."
            exit 1
          }

      - name: Download exact distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: VoiceFlow-Windows-x64
          path: release

      - name: Publish GitHub Release with Russian notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-$short_sha"
          title="VoiceFlow — Windows-сборка $short_sha"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" release/VoiceFlow-Windows-x64.zip release/VoiceFlow-Windows-x64.sha256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/VoiceFlow-Windows-x64.zip release/VoiceFlow-Windows-x64.sha256.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" \
              --notes-file RELEASE_NOTES_RU.md --prerelease
          fi
